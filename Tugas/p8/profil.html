<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Halaman profil Muhammad Zulfahmi Radityo - Mahasiswa SIF302 Pengembangan Aplikasi Berbasis Web.">
  <title>Profil</title>

  <link rel="stylesheet" href="token.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="komponen.css">
  <link rel="stylesheet" href="tema.css">
</head>

<body>

  <header>
    <div class="header-baris">
      <h1 id="judul-halaman"></h1>

      <input type="checkbox" id="tema" class="pengalih-tema">
      <label for="tema" class="tombol-tema">Tema Gelap</label>

      <nav>
        <ul>
          <li><a href="#profil">Profil</a></li>
          <li><a href="#katalog">Katalog</a></li>
          <li><a href="#kontak">Kontak</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <section id="profil">
      <h2>Biodata Mahasiswa</h2>
      <p id="perkenalan"></p>

      <div class="profil-kartu">
        <div class="profil-avatar-area">
          <div class="profil-avatar" id="profil-avatar"></div>
          <div class="profil-identitas">
            <span class="profil-nama" id="profil-nama"></span>
            <span class="profil-badge" id="profil-badge"></span>
          </div>
        </div>

        <div class="profil-grid" id="profil-grid"></div>
      </div>
    </section>

    <section id="katalog">
      <h2>Katalog Komik</h2>
      <div class="katalog" id="katalog-daftar"></div>
    </section>

    <section id="kontak">
      <h2>Form Kontak</h2>
      <form action="#" method="post" novalidate>
        <div class="form-kolom">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
          <span class="pesan-galat">Nama wajib diisi.</span>
        </div>

        <div class="form-kolom">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
          <span class="pesan-galat">Masukkan alamat email yang valid.</span>
        </div>

        <div class="form-kolom">
          <label for="kategori">Kategori Pesan</label>
          <select id="kategori" name="kategori">
            <option value="umum">Umum</option>
            <option value="pertanyaan">Pertanyaan</option>
            <option value="saran">Saran</option>
          </select>
        </div>

        <div class="form-kolom">
          <label for="pesan">Pesan</label>
          <textarea id="pesan" name="pesan" rows="4" placeholder="Tuliskan pesan Anda di sini..." required></textarea>
          <span class="pesan-galat">Pesan tidak boleh kosong.</span>
        </div>

        <button type="submit">Kirim Pesan</button>
      </form>
    </section>

  </main>

  <footer>
    <p id="catatan-kaki"></p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>

</html>
